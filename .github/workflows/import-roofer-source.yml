name: Import full Roofer Next.js project

on:
  push:
    paths:
      - ".github/workflows/import-roofer-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Download verified production source archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --location --retry 5 --retry-delay 3 \
            'https://roofer-nextjs-base.vercel.app/roofer-source-export.tar.gz' \
            --output /tmp/roofer-source-export.tar.gz
          test "$(stat -c %s /tmp/roofer-source-export.tar.gz)" -gt 100000
          tar -tzf /tmp/roofer-source-export.tar.gz > /tmp/roofer-files.txt
          grep -qx 'components/RooferClassic.tsx' /tmp/roofer-files.txt
          grep -qx 'lib/previewCompanies.ts' /tmp/roofer-files.txt
          grep -qx 'public/images/img-05.avif' /tmp/roofer-files.txt
          tar -xzf /tmp/roofer-source-export.tar.gz --exclude='README.md'
          test -s components/RooferClassic.tsx
          test -s lib/previewCompanies.ts

      - name: Commit the complete project and assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app components lib public package.json package-lock.json next.config.ts tsconfig.json .gitignore || true
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "feat: add Roofer Next.js template with 10 branded business previews"
            git push origin HEAD:main
          fi
